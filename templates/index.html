<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy - AI Fitness Plan Generator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
<div class="card">
<h1>FitBuddy</h1>
<p class="subtitle">AI Fitness Plan Generator</p>

{% if error %}
<div class="alert error">{{ error }}</div>
{% endif %}

<form action="/generate-workout" method="post">

<label for="name">Name</label>
<input id="name" name="name" required maxlength="100" placeholder="Enter your name">

<label for="user_id">User ID</label>
<input id="user_id" name="user_id" required maxlength="50" placeholder="Example: FB001">

<label for="age">Age</label>
<input id="age" name="age" type="number" min="13" max="100" required>

<label for="weight">Weight (kg)</label>
<input id="weight" name="weight" type="number" min="20" max="400" step="0.1" required>

<label for="goal">Fitness Goal</label>
<select id="goal" name="goal" required>
<option value="">Choose a goal</option>
<option value="weight loss">Weight Loss</option>
<option value="muscle gain">Muscle Gain</option>
<option value="general wellness">General Wellness</option>
<option value="flexibility">Flexibility</option>
</select>

<label for="intensity">Workout Intensity</label>
<select id="intensity" name="intensity" required>
<option value="">Choose intensity</option>
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>

<button type="submit">Generate 7-Day Plan</button>
</form>

<div class="links">
<a href="/view-all-users">View All Users</a>
<a href="/docs">API Docs</a>
</div>

</div>
</div>
</body>
</html>
